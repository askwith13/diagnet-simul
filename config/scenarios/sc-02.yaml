# SC-02 · Gradual Stockout · NET-B Balaghat · 25 ticks · Reactive
name: "Gradual stockout"
primary_network: NET-B
max_ticks: 25
affected_facilities: [TH-B, TL1-B]

per_tick_deltas:
  TH-B:
    truenat_chips: -1.4
    patients_queued: 0.8
    bayesian_stockout_prob: 0.025
    cascade_dropout_risk: 0.02

shap_weights:
  truenat_chips: 0.50
  patients_queued: 0.20
  bayesian_stockout_prob: 0.15
  cascade_dropout_risk: 0.15

reroutes:
  - [MC1-B, TL2-B]

alerts:
  - tick: 5
    type: warning
    severity: medium
    recipient: lab_supervisor
    facility: TH-B
    msg: "Order Truenat chips for TH-B immediately: only {truenat_chips:.0f} remaining, below safe threshold. Typical lead time is 3–5 days — order now to avoid testing disruption."
  - tick: 12
    type: critical
    severity: critical
    recipient: lab_supervisor
    facility: TH-B
    msg: "Place emergency chip order now: TH-B has only {truenat_chips:.0f} chips remaining. Testing capacity will be lost within 48h without resupply."
  - tick: 16
    type: dto_advisory
    severity: high
    recipient: dto
    facility: TH-B
    msg: "Escalate to DTO: TH-B chips will exhaust in ~2 days. Stockout probability is {bayesian_stockout_prob:.0%}. Activate overflow routing to TL1-B and TL2-B immediately."
  - tick: 20
    type: critical
    severity: critical
    recipient: dto
    facility: TH-B
    msg: "Testing at TH-B suspended — redirect all {patients_queued:.0f} queued patients to TL1-B and TL2-B now. Notify DTO and programme manager of cascade failure."

recommended_actions:
  TH-B:
    - "Place emergency Truenat chip order with district medical stores immediately"
    - "Activate overflow routing — redirect TH-B patients to TL1-B and TL2-B"
    - "Notify Programme Manager — campaign surge detected; request contingency stock"
