# SC-05 · Concurrent Multi-Failure · NET-E Amravati · 30 ticks · Reactive
name: "Concurrent multi-failure"
primary_network: NET-E
max_ticks: 30
affected_facilities: [DHC-E, TL1-E]

per_tick_deltas:
  DHC-E:
    cartridges: -1.4
    patients_queued: 1.6
    tat_hours: 0.5
    cascade_dropout_risk: 0.03

shap_weights:
  cartridges: 0.40
  patients_queued: 0.35
  tat_hours: 0.15
  cascade_dropout_risk: 0.10

reroutes:
  - [CHC3-E, TL2-E]
  - [CHC4-E, TL2-E]

alerts:
  - tick: 3
    type: warning
    severity: medium
    recipient: lab_supervisor
    facility: DHC-E
    msg: "Monitor closely: DHC-E shows dual pressure — {cartridges:.0f} cartridges (low) and {patients_queued:.0f} patients queued (rising). Pre-position contingency cartridge stock now."
  - tick: 8
    type: critical
    severity: critical
    recipient: dto
    facility: DHC-E
    msg: "Dual failure at DHC-E — act immediately: {cartridges:.0f} cartridges critical and {patients_queued:.0f} patients queued. Place emergency stock order and activate reroute simultaneously."
  - tick: 14
    type: recommendation
    severity: medium
    recipient: clinician
    facility: DHC-E
    msg: "Reroute CHC3-E and CHC4-E to TL2-E now. Current TAT at {tat_hours:.0f}h — this reroute will reduce hub pressure and improve turnaround time within 2 days."
  - tick: 22
    type: dto_advisory
    severity: medium
    recipient: dto
    facility: DHC-E
    msg: "Maintain sustained attention: queue reducing to {patients_queued:.0f} but cartridges still critical at {cartridges:.0f}. Confirm resupply ETA and keep reroute active until stock exceeds safe threshold."

recommended_actions:
  DHC-E:
    - "Emergency cartridge procurement — dual failure risk if stock {cartridges:.0f} not replenished within 48h"
    - "Activate Dijkstra-optimal reroute for CHC3-E and CHC4-E to TL2-E to reduce hub pressure"
    - "Mobilise CHW teams to reduce cascade dropout — current risk {cascade_dropout_risk:.2f}"
