# SC-04 · Cascade Failure + Inter-Network · NET-D Gadchiroli → NET-A · 30 ticks · Reactive
name: "Cascade failure + inter-network"
primary_network: NET-D
max_ticks: 30
affected_facilities: [DHC-D, TL1-D, DHC-A]

per_tick_deltas:
  DHC-D:
    patients_queued: 2.2
    truenat_chips: -1.8
    cascade_dropout_risk: 0.05
    hr_on_shift: -0.15
  DHC-A:
    patients_queued: 1.2
    tat_hours: 0.4
    cascade_dropout_risk: 0.02

shap_weights:
  patients_queued: 0.35
  truenat_chips: 0.25
  cascade_dropout_risk: 0.20
  hr_on_shift: 0.10
  tat_hours: 0.10

reroutes:
  - [CHC1-D, MC1-D]
  - [CHC2-D, MC1-D]

alerts:
  - tick: 4
    type: critical
    severity: critical
    recipient: lab_supervisor
    facility: DHC-D
    msg: "Respond urgently: DHC-D has {patients_queued:.0f} patients queued with only {truenat_chips:.0f} chips remaining. Begin overflow routing to NET-A and brief district DTO immediately."
  - tick: 8
    type: critical
    severity: critical
    recipient: dto
    facility: DHC-D
    msg: "Machine failure at DHC-D — activate inter-network overflow to DHC-A now. Only {machines} machines active. Dispatch biomedical engineer and notify NET-A coordinators."
  - tick: 12
    type: critical
    severity: critical
    recipient: dto
    facility: DHC-A
    msg: "Prepare DHC-A for inter-network overflow surge: {patients_queued:.0f} patients arriving from NET-D cascade. Reallocate lab capacity and increase staff alert level."
  - tick: 18
    type: dto_advisory
    severity: high
    recipient: dto
    facility: DHC-A
    msg: "Convene emergency DTO briefing: system-wide cascade risk at {cascade_dropout_risk:.0%}. Coordinate emergency staffing and CHW deployment across NET-A and NET-D to prevent further dropout."

recommended_actions:
  DHC-D:
    - "Activate inter-network overflow — route MDR-TB and complex cases to DHC-A immediately"
    - "Deploy emergency CHW teams to reduce cascade dropout in Gadchiroli catchment"
    - "Request engineer dispatch for machine repair — current status {machines} machines active"
  DHC-A:
    - "Prepare for inter-network overflow from NET-D — reallocate lab capacity"
    - "Increase TAT monitoring frequency — overflow pressure raising turnaround times"
    - "Brief DTO on system-wide stress — coordinate with Gadchiroli district officer"
