# SC-03 · Predicted Stockout (Bayesian) · NET-C Yavatmal · 25 ticks · Preventive
name: "Predicted stockout (Bayesian)"
primary_network: NET-C
max_ticks: 25
affected_facilities: [DHC-C]

per_tick_deltas:
  DHC-C:
    cartridges: -1.6
    bayesian_stockout_prob: 0.022
    patients_queued: 0.6

shap_weights:
  cartridges: 0.60
  bayesian_stockout_prob: 0.30
  patients_queued: 0.10

reroutes:
  - [MC3-C, TL2-C]
  - [MC4-C, TL2-C]

alerts:
  - tick: 6
    type: bayesian
    severity: high
    recipient: dto
    facility: DHC-C
    msg: "Order cartridges for DHC-C now: AI forecasts {bayesian_stockout_prob:.0%} probability of stockout within 14 days. Only {cartridges:.0f} cartridges remaining — intervene before shortage occurs."
  - tick: 9
    type: recommendation
    severity: medium
    recipient: dto
    facility: DHC-C
    msg: "Activate preventive reroute: divert MC3-C and MC4-C to TL2-C for 7 days. This conserves DHC-C cartridges ({cartridges:.0f} remaining) and reduces stockout risk proactively."
  - tick: 18
    type: bayesian
    severity: low
    recipient: dto
    facility: DHC-C
    msg: "Reroute intervention successful — stockout risk now at {bayesian_stockout_prob:.0%}. Restore normal routing and monitor DHC-C cartridge consumption weekly going forward."

# After preventive reroute fires at tick 9, MC3-C and MC4-C divert to TL2-C.
# DHC-C cartridge consumption drops sharply; Bayesian forecast resolves by tick 18.
event_activation_tick: 9
post_event_deltas:
  DHC-C:
    cartridges: -0.3          # slower drain — fewer patients reaching DHC-C directly
    bayesian_stockout_prob: -0.025  # P(stockout) declining as consumption drops
    patients_queued: -1.0     # queue easing as rerouted patients use TL2-C

recommended_actions:
  DHC-C:
    - "Order cartridge resupply immediately — current stock {cartridges:.0f}, estimated runway 14 days"
    - "Activate preventive reroute of MC3-C and MC4-C to TL2-C to conserve DHC-C cartridges"
    - "Monitor daily consumption rate and update Bayesian forecast weekly"
