[project]
name = "diagnet-simul"
version = "0.1.0"
description = "DiagNet simulation platform — TB diagnostic network intelligence for NTEP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "kaleido>=1.3.0",
    "networkx>=3.6.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "plotly>=6.8.0",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "streamlit>=1.58.0",
]

[dependency-groups]
dev = [
    "playwright>=1.60.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--tb=short"]

[tool.ruff]
line-length = 100
